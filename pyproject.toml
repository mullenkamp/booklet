[build-system]
requires = ["hatchling>=1.26.1"]
build-backend = "hatchling.build"

[project]
name = "booklet"
dynamic = ["version"]
description = "A python key-value file database"
readme = "README.rst"
license = "Apache-2.0"
authors = [
    { name = "Mike Kittridge", email = "mullenkamp1@gmail.com" },
]
keywords = [
    "dbm",
    "shelve",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]

requires-python = ">=3.10"
# portalocker>=3: booklet releases OS locks with portalocker.unlock(). The floor is
# empirical, not cautious — 2.x fails 6 of booklet's own tests for reasons unrelated to
# unlocking (it was never supported; the dependency simply had no floor to say so).
# There is deliberately NO upper cap: 4.2.0 made lock() reject LOCK_UN, which booklet
# used to rely on, and the fix was to stop relying on it. Verified 165/165 on 3.0.0,
# 4.1.0 and 4.2.0.
dependencies = ['portalocker>=3', 'orjson', 'uuid6>=2024.07.10']

[dependency-groups]
dev = [
  "spyder-kernels==2.5",
  "black",
  "mypy",
  "ruff",
  "pytest",
  "pytest-cov",
]

[tool.hatch.envs.default]
# type = "container"
# image = 'python:3.9-slim-bullseye'
python = "3.10"
dependencies = [
  "spyder-kernels==2.4",
  "matplotlib",
  "coverage[toml]>=6.5",
  "pytest",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.9", "3.10", "3.11"]

[project.urls]
Homepage = "https://github.com/mullenkamp/booklet"

[tool.hatch.build.targets.sdist]
include = [
    "/booklet",
]
exclude = [
  "/booklet/tests/*",
]

[tool.hatch.version]
path = "booklet/__init__.py"

